<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pixel-art button, disabled state (used by Options and Exit).
  Same geometry as pixel-button-normal.svg; the gold frame is replaced by desaturated
  grey and the blue body by a dim slate, so the button reads as inert without
  relying on CSS opacity.
  Logical pixel grid: 64x16 (rendered at 256x64, a 4x nearest-neighbour-style upscale).
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="256"
  height="64"
  viewBox="0 0 64 16"
  shape-rendering="crispEdges"
>
  <title>Pixel button - disabled state</title>

  <polygon fill="#0a0c18" points="2,0 62,0 64,2 64,14 62,16 2,16 0,14 0,2" />
  <polygon fill="#6a6a72" points="3,1 61,1 63,3 63,13 61,15 3,15 1,13 1,3" />
  <polygon fill="#0a0c18" points="4,2 60,2 62,4 62,12 60,14 4,14 2,12 2,4" />
  <polygon fill="#3a3e4c" points="5,3 59,3 61,5 61,11 59,13 5,13 3,11 3,5" />

  <!-- Body bevel, flattened to read as inert -->
  <rect x="5" y="3" width="54" height="1" fill="#565b6e" />
  <rect x="5" y="12" width="54" height="1" fill="#22242e" />

  <!-- Side notches, desaturated -->
  <rect x="6" y="7" width="2" height="2" fill="#6a6a72" />
  <rect x="56" y="7" width="2" height="2" fill="#6a6a72" />
</svg>
