<?xml version="1.0" encoding="UTF-8"?>
<!--
  Initial screen background.
  Logical pixel grid: 320x180 (rendered at 1280x720, a 4x nearest-neighbour-style upscale).
  Opaque scene: this is the bottommost layer of the initial menu screen.
  Dusk battlefield vista: layered sky bands, moon, mountain ranges, hills and a stone
  courtyard terrace with two brazier pillars framing the centre, where the menu panel sits.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1280"
  height="720"
  viewBox="0 0 320 180"
  shape-rendering="crispEdges"
  preserveAspectRatio="xMidYMid slice"
>
  <title>Initial screen background</title>

  <!-- Sky: stepped bands, darkest at the top down to a warm horizon glow -->
  <g id="sky">
    <rect x="0" y="0" width="320" height="16" fill="#10132a" />
    <rect x="0" y="16" width="320" height="14" fill="#1b1f3b" />
    <rect x="0" y="30" width="320" height="14" fill="#262c52" />
    <rect x="0" y="44" width="320" height="12" fill="#343b66" />
    <rect x="0" y="56" width="320" height="10" fill="#4a4f8c" />
    <rect x="0" y="66" width="320" height="8" fill="#6b5f96" />
    <rect x="0" y="74" width="320" height="8" fill="#9a6f8e" />
    <rect x="0" y="82" width="320" height="8" fill="#c88a6a" />
    <rect x="0" y="90" width="320" height="8" fill="#e0a878" />
  </g>

  <!-- Stars: 1x1 and 2x2 pixel specks, kept out of the warm horizon bands -->
  <g id="stars" fill="#e8e4d8">
    <rect x="18" y="8" width="1" height="1" />
    <rect x="42" y="20" width="2" height="2" />
    <rect x="63" y="6" width="1" height="1" />
    <rect x="88" y="14" width="1" height="1" />
    <rect x="104" y="28" width="2" height="2" />
    <rect x="126" y="10" width="1" height="1" />
    <rect x="150" y="22" width="1" height="1" />
    <rect x="172" y="5" width="2" height="2" />
    <rect x="196" y="17" width="1" height="1" />
    <rect x="212" y="33" width="1" height="1" />
    <rect x="230" y="9" width="1" height="1" />
    <rect x="276" y="12" width="2" height="2" />
    <rect x="296" y="26" width="1" height="1" />
    <rect x="310" y="6" width="1" height="1" />
    <rect x="34" y="40" width="1" height="1" />
    <rect x="70" y="46" width="1" height="1" />
    <rect x="142" y="42" width="1" height="1" />
    <rect x="258" y="44" width="1" height="1" />
  </g>

  <!-- Moon: stepped pixel disc with a few craters -->
  <g id="moon">
    <g fill="#f0e8c8">
      <rect x="245" y="20" width="6" height="1" />
      <rect x="243" y="21" width="10" height="1" />
      <rect x="242" y="22" width="12" height="1" />
      <rect x="241" y="23" width="14" height="2" />
      <rect x="240" y="25" width="16" height="6" />
      <rect x="241" y="31" width="14" height="2" />
      <rect x="242" y="33" width="12" height="1" />
      <rect x="243" y="34" width="10" height="1" />
      <rect x="245" y="35" width="6" height="1" />
    </g>
    <g fill="#d4c8a0">
      <rect x="244" y="24" width="3" height="3" />
      <rect x="250" y="29" width="2" height="2" />
      <rect x="247" y="32" width="2" height="1" />
    </g>
  </g>

  <!-- Flat cloud streaks sitting on the horizon glow -->
  <g id="clouds">
    <rect x="24" y="76" width="48" height="2" fill="#8a6f9a" />
    <rect x="36" y="78" width="28" height="2" fill="#a8809c" />
    <rect x="186" y="72" width="60" height="2" fill="#8a6f9a" />
    <rect x="200" y="74" width="36" height="2" fill="#a8809c" />
    <rect x="96" y="86" width="72" height="2" fill="#d89a78" />
    <rect x="252" y="84" width="44" height="2" fill="#c88a6a" />
  </g>

  <!-- Far mountain range -->
  <g id="mountains-far">
    <polygon
      fill="#2a2446"
      points="0,104 34,74 62,96 96,66 134,98 168,78 206,100 244,72 284,96 320,80 320,118 0,118"
    />
    <polygon fill="#6e6ea0" points="96,66 104,74 88,74" />
    <polygon fill="#6e6ea0" points="244,72 251,79 237,79" />
  </g>

  <!-- Near mountain range -->
  <polygon
    id="mountains-near"
    fill="#1d1930"
    points="0,110 40,92 76,108 116,88 158,110 196,94 240,112 282,92 320,106 320,126 0,126"
  />

  <!-- Rolling hills, two layers -->
  <polygon
    id="hills-far"
    fill="#22361f"
    points="0,122 48,114 104,124 160,112 216,122 268,114 320,120 320,142 0,142"
  />
  <polygon
    id="hills-near"
    fill="#2c4a2a"
    points="0,136 60,128 120,138 190,126 260,136 320,130 320,180 0,180"
  />

  <!-- Stone courtyard terrace in the foreground -->
  <g id="terrace">
    <rect x="0" y="150" width="320" height="30" fill="#262633" />
    <rect x="0" y="150" width="320" height="2" fill="#3c3c4e" />
    <rect x="0" y="164" width="320" height="2" fill="#1a1a24" />
    <rect x="0" y="166" width="320" height="2" fill="#32323f" />
    <g fill="#1a1a24">
      <!-- Upper course of block seams -->
      <rect x="16" y="152" width="1" height="12" />
      <rect x="48" y="152" width="1" height="12" />
      <rect x="80" y="152" width="1" height="12" />
      <rect x="112" y="152" width="1" height="12" />
      <rect x="144" y="152" width="1" height="12" />
      <rect x="176" y="152" width="1" height="12" />
      <rect x="208" y="152" width="1" height="12" />
      <rect x="240" y="152" width="1" height="12" />
      <rect x="272" y="152" width="1" height="12" />
      <rect x="304" y="152" width="1" height="12" />
      <!-- Lower course, seams offset by half a block -->
      <rect x="0" y="168" width="1" height="12" />
      <rect x="32" y="168" width="1" height="12" />
      <rect x="64" y="168" width="1" height="12" />
      <rect x="96" y="168" width="1" height="12" />
      <rect x="128" y="168" width="1" height="12" />
      <rect x="160" y="168" width="1" height="12" />
      <rect x="192" y="168" width="1" height="12" />
      <rect x="224" y="168" width="1" height="12" />
      <rect x="256" y="168" width="1" height="12" />
      <rect x="288" y="168" width="1" height="12" />
    </g>
  </g>

  <!-- Left brazier pillar -->
  <g id="pillar-left">
    <rect x="12" y="104" width="20" height="52" fill="#2e2e3c" />
    <rect x="12" y="104" width="4" height="52" fill="#3e3e50" />
    <rect x="28" y="104" width="4" height="52" fill="#1c1c26" />
    <rect x="8" y="100" width="28" height="6" fill="#3a3a4a" />
    <rect x="8" y="152" width="28" height="8" fill="#3a3a4a" />
    <rect x="8" y="158" width="28" height="2" fill="#1c1c26" />
    <rect x="16" y="92" width="12" height="8" fill="#2e2e3c" />
    <rect x="18" y="86" width="8" height="6" fill="#e08a3a" />
    <rect x="20" y="82" width="4" height="4" fill="#f0c060" />
    <rect x="21" y="78" width="2" height="4" fill="#f4e0a0" />
  </g>

  <!-- Right brazier pillar -->
  <g id="pillar-right">
    <rect x="288" y="104" width="20" height="52" fill="#2e2e3c" />
    <rect x="288" y="104" width="4" height="52" fill="#3e3e50" />
    <rect x="304" y="104" width="4" height="52" fill="#1c1c26" />
    <rect x="284" y="100" width="28" height="6" fill="#3a3a4a" />
    <rect x="284" y="152" width="28" height="8" fill="#3a3a4a" />
    <rect x="284" y="158" width="28" height="2" fill="#1c1c26" />
    <rect x="292" y="92" width="12" height="8" fill="#2e2e3c" />
    <rect x="294" y="86" width="8" height="6" fill="#e08a3a" />
    <rect x="296" y="82" width="4" height="4" fill="#f0c060" />
    <rect x="297" y="78" width="2" height="4" fill="#f4e0a0" />
  </g>
</svg>
